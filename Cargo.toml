[package]
name = "crossroads"
version = "0.1.0"
edition = "2021"
description = "Crossroads - see every food place, menu and deals link at an intersection. Rust + SQLite + advanced CSS, locally hosted."
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
